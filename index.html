<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TodoFlow</title>
<style>
body { font-family: Arial; background: #0f0f0f; color: #fff; text-align: center; padding: 50px; }
h1 { font-size: 3em; }
input { padding: 10px; width: 300px; margin: 20px; }
button { padding: 10px 20px; background: #00ff9f; border: none; cursor: pointer; }
ul { list-style: none; max-width: 400px; margin: 20px auto; }
li { background: #1f1f1f; margin: 5px; padding: 10px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<h1>TodoFlow</h1>
<input id="task" placeholder="New task...">
<button onclick="addTask()">Add</button>
<ul id="list"></ul>

<script>
function addTask() {
  let task = document.getElementById('task').value;
  if (!task) return;
  let li = document.createElement('li');
  li.innerHTML = `${task} <button onclick="this.parentElement.remove()">Done</button>`;
  document.getElementById('list').appendChild(li);
  document.getElementById('task').value = '';
}
</script>
</body>
</html>
