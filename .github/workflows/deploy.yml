name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/worker/package.json

      - name: Install worker dependencies
        working-directory: packages/worker
        run: npm ci

      - name: Validate required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          KV_PREVIEW_ID: ${{ secrets.KV_PREVIEW_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [[ -z "$D1_DATABASE_ID" ]] && missing+=("D1_DATABASE_ID")
          [[ -z "$KV_NAMESPACE_ID" ]] && missing+=("KV_NAMESPACE_ID")
          [[ -z "$KV_PREVIEW_ID" ]] && missing+=("KV_PREVIEW_ID")
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=("CLOUDFLARE_API_TOKEN")
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::The following required secrets are not set: ${missing[*]}. Please add them in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Configure wrangler.toml with secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          KV_PREVIEW_ID: ${{ secrets.KV_PREVIEW_ID }}
        run: |
          sed -i "s/your-d1-database-id/${D1_DATABASE_ID}/g" wrangler.toml
          sed -i "s/your-kv-namespace-id/${KV_NAMESPACE_ID}/g" wrangler.toml
          sed -i "s/your-kv-preview-id/${KV_PREVIEW_ID}/g" wrangler.toml

      - name: Run D1 migrations
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: deploy
